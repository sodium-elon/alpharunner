# Source-owned knowledge stays readable, but cannot be changed by Sportscoach's
# own tools/subprocesses. Operator installs run outside this mount namespace.
[Service]
PrivateUsers=yes
ExecStartPre=%h/.hermes/hermes-agent/venv/bin/python -B %h/projects/alpharunner.workspace/alpharunner/scripts/sportscoach_profile_policy.py --verify
ExecStartPre=/usr/bin/python3 -B %h/projects/alpharunner.workspace/alpharunner/scripts/install-sportscoach-skills.py --verify
ReadOnlyPaths=%h/.hermes/profiles/sportscoach/skills/sportscoach-decisions %h/.hermes/profiles/sportscoach/skills/running-coaching %h/.hermes/profiles/sportscoach/skills/alpharunner-garmin-run-import %h/.hermes/profiles/sportscoach/skills/.sportscoach-install.json %h/projects/alpharunner.workspace/alpharunner/skills %h/.hermes/profiles/sportscoach/skills/smart-home/alexa-voice-replies %h/projects/hermes-voice-ha-integration.workspace/hermes-voice-ha-integration/skills/profiles/sportscoach
